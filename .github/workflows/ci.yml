name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Valores fictícios: o build só precisa que as variáveis existam.
      # Nenhum passo deste job conecta no banco.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # O postinstall roda `prisma generate`.
      - run: npm ci

      - name: Validar schema do Prisma
        run: npx prisma validate

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

  trader-b3:
    name: trader-b3 (Python, testes offline)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: trader-b3
    steps:
      - uses: actions/checkout@v4

      # Versão mínima suportada pelo pacote.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cópias de b3comum.py iguais à fonte
        run: python tools/sync_comum.py --check

      - name: Testes (unittest, offline)
        run: python -m unittest discover -s tests -v
