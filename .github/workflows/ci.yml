name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Valores fictícios: o build só precisa que as variáveis existam.
      # Nenhum passo deste job conecta no banco.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # O postinstall roda `prisma generate`.
      - run: npm ci

      - name: Validar schema do Prisma
        run: npx prisma validate

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

  migrations:
    name: Migrações no Postgres (como no Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        # Mesma versão principal dos projetos novos do Supabase.
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Banco descartável do próprio job; nada aqui é segredo.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # O mesmo comando que o deploy de produção roda na Vercel.
      - name: Aplicar migrações do zero
        run: npx prisma migrate deploy

      # Falha se alguém mudou o schema.prisma sem gerar a migração.
      - name: Schema igual às migrações
        run: >-
          npx prisma migrate diff
          --from-url "$DIRECT_URL"
          --to-schema-datamodel prisma/schema.prisma
          --exit-code

      # Sem RLS, a Data API do Supabase expõe a tabela para a chave anon.
      - name: Toda tabela de public com RLS
        env:
          PGPASSWORD: ci
        run: |
          sem_rls=$(psql -h localhost -U ci -d ci -tAc \
            "SELECT string_agg(tablename, ', ') FROM pg_tables WHERE schemaname = 'public' AND NOT rowsecurity")
          if [ -n "$sem_rls" ]; then
            echo "::error::Tabelas sem RLS: $sem_rls. Inclua ALTER TABLE ... ENABLE ROW LEVEL SECURITY na migração."
            exit 1
          fi

  trader-b3:
    name: trader-b3 (Python, testes offline)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: trader-b3
    steps:
      - uses: actions/checkout@v4

      # Versão mínima suportada pelo pacote.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cópias de b3comum.py iguais à fonte
        run: python tools/sync_comum.py --check

      - name: Testes (unittest, offline)
        run: python -m unittest discover -s tests -v

  secrets:
    name: Varredura de segredos (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # O repositório é público: nenhum commit novo pode trazer chave, token
      # ou senha. Varre só os commits desta mudança (PR: desde a base; push
      # na main: desde o commit anterior), com o achado mascarado no log.
      - name: Intervalo de commits
        id: range
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_REF" ]; then
            echo "range=origin/$BASE_REF..HEAD" >> "$GITHUB_OUTPUT"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            echo "range=$BEFORE..HEAD" >> "$GITHUB_OUTPUT"
          else
            echo "range=HEAD~1..HEAD" >> "$GITHUB_OUTPUT"
          fi

      - name: gitleaks
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" -w /repo
          zricethezav/gitleaks:v8.21.2
          git . --redact --no-banner --verbose
          --log-opts="--no-merges ${{ steps.range.outputs.range }}"
